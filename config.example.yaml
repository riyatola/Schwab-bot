# Default configuration for schwab-options-bot.
# Secret values (keys, tokens) are overridden by environment variables at
# runtime on Render. DO NOT commit real secrets to this file.
#
# Required environment variables (Render "Environment" tab or render.yaml):
#   BOT_MODE              - "paper" or "live" (default: paper)
#   SCHWAB_APP_KEY        - Schwab developer app key
#   SCHWAB_APP_SECRET     - Schwab developer app secret
#   SCHWAB_CALLBACK_URL   - OAuth callback URL (default: https://127.0.0.1)
#   SCHWAB_ACCOUNT_INDEX  - Which linked Schwab account index to use (default: 0)
#   TELEGRAM_BOT_TOKEN    - Telegram bot token from @BotFather
#   TELEGRAM_CHAT_ID      - Your Telegram chat/user ID
#   FINNHUB_API_KEY       - Finnhub free-tier key (earnings calendar + news sentiment)
#   FRED_API_KEY          - FRED free-tier key (macro regime: VIX, yield curve, spreads)

mode: paper

paper:
  starting_cash: 5000
  slippage_bps: 5
  commission_per_contract: 0.65
  early_assignment_itm_threshold_pct: 0.05

schwab:
  app_key: ""
  app_secret: ""
  callback_url: "https://127.0.0.1"
  token_path: "/data/tokens.json"
  account_index: 0
  paper_db_path: "/data/bot.db"

telegram:
  bot_token: ""
  chat_id: ""

earnings:
  finnhub_api_key: ""

fred:
  api_key: ""

universe:
  indices: ["NASDAQ100", "SP500"]
  extra_symbols: ["PLTR", "GME", "AMC", "DDOG", "NET", "U", "AI", "PATH", "DOCN", "FSLY", "COIN", "HOOD", "SOFI", "AFRM", "KSS", "M", "W", "OLLI", "RUN", "PLUG", "FCEL", "NKLA", "BLDP", "SAVA", "NVAX", "BNGO", "CRSP", "EDIT", "OPEN", "RDFN", "COMP", "ARKK", "BITO", "BOIL", "SQ", "TWLO", "OKTA", "MDB", "ESTC", "ROKU", "ETSY", "PINS", "SNAP", "BYND", "UPST", "FVRR", "WIX", "ZI", "BILL", "ASAN", "HIMS", "DUOL", "ONON", "CROX", "YETI", "FIGS", "OLO", "SAM", "SHAK", "CHWY", "PTON", "SPCE", "ASTS", "LUNR", "INTA", "S", "TENB", "CYBR", "PAYO", "DLO", "NU", "PAGS", "STNE"]
  exclude_symbols: []
  # Curated quality names for the LEAPS scanner. Empty = fall back to
  # NASDAQ100 + SP500 index constituents only (extra_symbols are not scanned
  # for LEAPS — their IV is rich and the underlying can go to zero).
  leaps_watchlist: []
  min_avg_option_volume: 1000
  min_underlying_price: 10
  max_underlying_price: 2000

liquidity:
  max_leg_spread_pct: 0.20

scan:
  poll_interval_seconds: 900
  market_hours_only: true

strategies:
  credit_spreads:
    enabled: true
    min_iv_rank: 50
    min_iv_percentile: 60
    target_short_delta: 0.20
    min_credit_to_width_ratio: 0.25
    dte_min: 21
    dte_max: 45
    max_leg_spread_pct: 0.20
  directional:
    enabled: true
    trend_lookback_days: 20
    volume_multiple_trigger: 1.5
    min_iv_rank: 20
    max_iv_rank: 60
    dte_min: 30
    dte_max: 60
    use_rsi_filter: true
    rsi_threshold: 55
    rsi_min: 55
    use_adx_filter: true
    adx_min: 25
  earnings_vol:
    enabled: true
    days_before_earnings: 7
    min_expected_move_edge: 0.10
    dte_min: 3
    dte_max: 10
    max_leg_spread_pct: 0.20
  wheel:
    enabled: true
    csp_target_delta: 0.25
    covered_call_target_delta: 0.25
    dte_min: 21
    dte_max: 45
    max_leg_spread_pct: 0.20
  leaps:
    enabled: true
    variant: stock_replacement
    dte_min: 365
    dte_max: 730
    target_delta: 0.80
    min_delta: 0.70
    max_delta: 0.90
    min_iv_rank: 0
    max_iv_rank: 50
    trend_lookback_days: 126
    min_trend_strength: 0.2
    max_extension_pct: 0.15
    max_annualized_extrinsic_pct: 0.08
    max_leg_spread_pct: 0.10
    min_open_interest: 50
    avoid_earnings_within_days: 3
    max_premium_per_contract_dollars: null
    min_score: 0.55
    cooldown_days: 7
    max_chain_fetches_per_cycle: 60
    exits:
      force_exit_dte: 120

risk:
  max_risk_per_sector_pct: 0.04
  max_risk_per_portfolio_pct: 0.20
  max_risk_per_trade_pct: 0.02
  max_concurrent_positions: 4
  max_positions_per_symbol: 1
  max_new_trades_per_day: 5
  respect_pdt_rule: true
  max_positions_per_sector: 2
  leaps:
    max_premium_pct_per_position: 0.10
    max_total_leaps_pct: 0.30
    max_risk_per_sector_pct: 0.15
