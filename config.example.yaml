approval:
  timeout_minutes: 15

learning:
  enabled: true
  min_trades_for_multiplier: 5
  multiplier_floor: 0.5
  multiplier_ceiling: 1.5
  use_ml: false
  ml_min_training_rows: 150
  ml_retrain_every_n_trades: 25
  ml_model_path: "/data/learning_model.joblib"
  ml_blend_weight: 0.3
  outcome_poll_minutes: 45
  report_day_of_week: "sun"
  report_hour: 18

guardrails:
  enabled: true
  min_trades_for_stats: 5
  max_consecutive_losses: 3
  min_win_rate: 0.30
  max_cumulative_loss_dollars: 500
  ban_duration_days: 90

sentiment:
  enabled: true
  persistence_days: 3
  directional_vix_min: 15.0
  directional_vix_max: 25.0
  directional_vix_band_multiplier: 0.0
  vix_lookback_days: 252
  vix_high_percentile: 80
  vix_low_percentile: 20
  curve_inversion_bps: 0
  credit_spread_widen_bps: 20
  credit_spread_tighten_bps: -10
  breakeven_high_pct: 3.0
  breakeven_low_pct: 1.5
  surprise_index_high: 50
  surprise_index_low: -50
  put_call_ratio_high: 1.2
  put_call_ratio_low: 0.7
  news_extreme_threshold: 0.8
  contrarian_dampening_factor: 0.5
  risk_off_multipliers:
    directional: 0.0
    earnings_vol: 0.0
    credit_spreads: 0.5
    wheel: 0.5
    leaps: 0.5
  risk_on_multipliers:
    directional: 1.15
    earnings_vol: 1.15
    credit_spreads: 1.05
    wheel: 1.05
    leaps: 1.10
  neutral_multipliers:
    directional: 1.0
    earnings_vol: 1.0
    credit_spreads: 1.0
    wheel: 1.0
    leaps: 1.0

exits:
  enabled: true
  risk_off_stop_loss_factor: 0.5
  use_dynamic_stops: true
  atr_multiplier: 2.0
  iv_adjustment_factor: 0.5
  time_decay_factor: 0.2
  min_stop_pct: 0.10
  max_stop_pct: 0.50
  default_stop_loss_pct:
    credit_spreads: 0.50
    directional: 0.50
    earnings_vol: 0.50
    wheel: 0.50
    leaps: 0.40
  default_take_profit_pct:
    credit_spreads: 0.50
    directional: 1.00
    earnings_vol: 0.75
    wheel: 0.50
    leaps: 1.00
  force_exit_dte: 7
  approval_timeout_minutes: 10

backtest:
  max_spread_pct_skip: 0.10

circuit_breaker:
  enabled: true
  daily_loss_limit_dollars: 1000
  manual_kill: false
  check_interval_seconds: 900
